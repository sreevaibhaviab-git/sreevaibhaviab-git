<svg xmlns="http://www.w3.org/2000/svg"
width="1200"
height="515"
viewBox="0 0 1200 515">

<defs>

<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#08080f"/>
<stop offset="100%" stop-color="#100913"/>
</linearGradient>

<linearGradient id="g" x1="0" x2="1">
<stop offset="0%" stop-color="#ff5caf"/>
<stop offset="50%" stop-color="#b873ff"/>
<stop offset="100%" stop-color="#5de5fb"/>
</linearGradient>

<filter id="glow">
<feGaussianBlur stdDeviation="5" result="x"/>
<feMerge>
<feMergeNode in="x"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>

</defs>

<rect width="1200"
height="515"
rx="26"
fill="url(#bg)"/>

<text x="65"
y="65"
font-family="monospace"
font-size="13"
letter-spacing="4"
fill="#ff79bd">
