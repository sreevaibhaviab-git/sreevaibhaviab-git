</text>

<!-- scanner -->

<rect x="-300"
y="681"
width="300"
height="2"
fill="url(#rainbow)"
filter="url(#glow)">
<animate attributeName="x"
values="-300;1200"
dur="3s"
repeatCount="indefinite"/>
</rect>

</svg>
